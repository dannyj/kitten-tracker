<svg width="520" height="128" viewBox="0 0 260 64" xmlns="http://www.w3.org/2000/svg">
  <title>KittenTracker — primary logo lockup</title>
  <desc>Kitten Tracker logo: cat head mark in forest teal with KittenTracker wordmark. Teal text for Kitten, amber text for Tracker.</desc>

  <!-- Cat head mark (52×56 source, scaled 0.857× to 44.6×48, offset to 8,8) -->
  <g transform="translate(8,8) scale(0.857)">
    <!-- Ears -->
    <polygon points="5,26 14,4 23,22" fill="#1D7874"/>
    <polygon points="47,26 38,4 29,22" fill="#1D7874"/>
    <!-- Head -->
    <rect x="5" y="18" width="42" height="34" rx="13" fill="#1D7874"/>
    <!-- Inner ear shading -->
    <polygon points="8,25 14,9 21,22" fill="white" fill-opacity="0.14"/>
    <polygon points="44,25 38,9 31,22" fill="white" fill-opacity="0.14"/>
    <!-- Eyes -->
    <ellipse cx="18" cy="32" rx="4.5" ry="4" fill="white"/>
    <ellipse cx="34" cy="32" rx="4.5" ry="4" fill="white"/>
    <!-- Pupils -->
    <ellipse cx="18.8" cy="32" rx="2" ry="3.2" fill="#0F4A47"/>
    <ellipse cx="34.8" cy="32" rx="2" ry="3.2" fill="#0F4A47"/>
    <!-- Nose -->
    <path d="M24,40 L26,37.5 L28,40 Z" fill="white" fill-opacity="0.85"/>
    <!-- Mouth -->
    <path d="M23.5,40.5 Q26,43 28.5,40.5" stroke="white" stroke-width="0.9" fill="none" fill-opacity="0.5"/>
    <!-- Amber tracker dots -->
    <circle cx="39" cy="44" r="2" fill="#F2A63D"/>
    <circle cx="44" cy="41.5" r="1.3" fill="#F2A63D" fill-opacity="0.65"/>
    <circle cx="47.5" cy="45" r="1" fill="#F2A63D" fill-opacity="0.35"/>
  </g>

  <!-- Wordmark — two-colour, continuous flow -->
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="22" font-weight="600" dominant-baseline="middle" y="33">
    <tspan x="65" fill="#1D7874">Kitten</tspan><tspan fill="#F2A63D">Tracker</tspan>
  </text>
</svg>
